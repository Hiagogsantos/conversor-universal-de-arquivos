# Gera o executável para Windows usando o build.py do projeto
# (ele instala as dependências, baixa o FFmpeg e roda o PyInstaller).
name: Gerar executável

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build completo
        run: python build.py

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path "dist/*" -DestinationPath "ConversorUniversal-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ConversorUniversal-windows
          path: ConversorUniversal-windows.zip

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ConversorUniversal-windows.zip
